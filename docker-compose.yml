services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-DermaImage}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published on the loopback interface only: reachable from the host for
    # maintenance (psql, backups) but not from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-DermaImage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dermauh

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-DermaImage};Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:-root1234}"
      FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5130}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:-CHANGE_THIS_TO_A_STRONG_SECRET_KEY_AT_LEAST_32_CHARS}
      JwtSettings__Issuer: ${JWT_ISSUER:-DermaUH-API}
      JwtSettings__Audience: ${JWT_AUDIENCE:-DermaUH-Web}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-1440}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BootstrapAdmin__FirstName: ${BOOTSTRAP_ADMIN_FIRST_NAME:-Administrador}
      BootstrapAdmin__LastName: ${BOOTSTRAP_ADMIN_LAST_NAME:-DermaUH}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      EmailSettings__SmtpServerAddress: ${SMTP_SERVER_ADDRESS:-}
      EmailSettings__SmtpServerPort: ${SMTP_SERVER_PORT:-587}
      EmailSettings__SmtpUserName: ${SMTP_USERNAME:-}
      EmailSettings__SmtpPassword: ${SMTP_PASSWORD:-}
      EmailSettings__EnableSSL: ${SMTP_ENABLE_SSL:-false}
      EmailSettings__EmailAddress: ${SMTP_FROM_ADDRESS:-noreply@dermauh.cu}
      EmailSettings__EmailAddressDisplay: ${SMTP_FROM_DISPLAY_NAME:-DermaUH Images}
      EmailSettings__EnvironmentSubjectPrefix: ${SMTP_SUBJECT_PREFIX:-}
    volumes:
      - api_images:/app/ImageStorage
      # Identity email-confirmation and password-reset tokens are signed with
      # these keys; losing them invalidates every link already sent.
      - api_keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "${API_PORT:-5131}:8080"
    networks:
      - dermauh

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ApiBaseUrl: http://api:8080
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - web_keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "${WEB_PORT:-5130}:8080"
    networks:
      - dermauh

  # Optional SMTP catcher for testing, started only with `--profile mail`.
  # Set SMTP_SERVER_ADDRESS=mailpit and SMTP_SERVER_PORT=1025 to use it;
  # captured emails are shown at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - dermauh

volumes:
  postgres_data:
  api_images:
  api_keys:
  web_keys:

networks:
  dermauh:
    driver: bridge
